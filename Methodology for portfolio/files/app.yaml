# app.yaml - Google App Engine Configuration
# Alternative deployment method to Cloud Run

runtime: python39

# Entry point - start Streamlit
entrypoint: streamlit run streamlit_dashboard.py --server.port $PORT --server.address 0.0.0.0

# Auto-scaling configuration
automatic_scaling:
  min_instances: 0              # Scale to zero when idle
  max_instances: 10             # Maximum instances
  target_cpu_utilization: 0.65  # Scale at 65% CPU
  target_throughput_utilization: 0.70

# Resource allocation
resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

# Environment variables (optional)
env_variables:
  STREAMLIT_SERVER_HEADLESS: 'true'
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'

# Handlers (optional - for static files)
handlers:
  # Serve static files
  - url: /static
    static_dir: static
    secure: always

  # All other routes to Streamlit
  - url: /.*
    script: auto
    secure: always
